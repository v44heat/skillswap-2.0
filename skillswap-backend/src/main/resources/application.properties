spring.application.name=skillswap-backend
server.port=8080

# ── Database ──────────────────────────────────────────────
# CHANGE THIS: Update with your actual PostgreSQL password below
spring.datasource.url=jdbc:postgresql://localhost:5432/skillswap
spring.datasource.username=postgres
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings (prevents startup hang if DB is slow)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=30000

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────
jwt.secret=yourJWTKey
jwt.expiration=86400000

# ── Multipart ─────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── Logging ───────────────────────────────────────────────
logging.level.com.skillswap=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
